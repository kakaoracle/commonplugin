<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 美化 - kakaoracle</title><link rel="stylesheet" href="json.css"></head><body><main class="json-app"><header><div><h1>JSON 美化</h1><p>粘贴 JSON 字符串，格式化后查看可折叠结构。</p></div><button id="copy-output" type="button">复制结果</button></header><section class="workspace"><div class="pane"><div class="pane__head"><span>输入</span><div><button id="format" type="button">格式化</button><button id="minify" type="button">压缩</button><button id="clear" type="button">清空</button></div></div><textarea id="input" spellcheck="false" placeholder="粘贴 JSON 字符串…"></textarea><p id="message" class="message"></p></div><div class="pane"><div class="pane__head"><span>结果</span><button id="expand-all" type="button">展开/收起</button></div><pre id="output" class="tree"></pre></div></section></main><script src="json.js"></script></body></html>
